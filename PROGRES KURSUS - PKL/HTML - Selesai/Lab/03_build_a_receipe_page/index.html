    <body>
      <h1>Telur Kecap Goreng</h1>
      <p>Adalah lauk kesukaan sekaligus andalan aku selama PKL.</p>
      <h2>Ingredients</h2>
      <ul>
        <li>Telur ayam</li>
        <li>Kecap</li>
        <li>Minyak</li>
        <li>Perasaan</li>
        <h2>Instructions</h2>
        <ol>
          <li>Panaskan minyak.</li>
          <li>Masukan telur.</li>
          <li>Tambahkan kecap.</li>
          <li>Masak pake perasaan, jadi deh.</li>
        </ol>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/recipe.jpg" alt="3 telur putih, pengaduk, tepung, dan susu.">
      </ul>
